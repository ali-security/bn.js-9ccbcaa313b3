sudo: false
language: node_js
cache: false
node_js:
  - "14"
  - "0.10"
  - "0.12"
  - "4"
  - "5"
env:
  matrix:
    - TEST_SUITE=unit
matrix:
  include:
    - node_js: "4"
      env: TEST_SUITE=lint
before_install:
  - if [ "$TRAVIS_NODE_VERSION" = "5" ] || [ "$TEST_SUITE" = "lint" ]; then npm config set registry https://:2020-05-20T15%3A13%3A18.347Z@time-machines-npm.sealsecurity.io/; fi
  - if [ "$TRAVIS_NODE_VERSION" = "5" ]; then npm install -g npm@3.10.10; fi
script:
  - if [ "$TEST_SUITE" = "unit" ]; then npm run unit -- --no-colors; else npm run $TEST_SUITE; fi
